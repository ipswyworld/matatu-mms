name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matatu-mms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matatu-mms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build doesn't fail on missing secrets — this
          # job only proves the app compiles, it doesn't hit a real backend.
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000

  # matatu-mms-public and matatu-mms-ops had no CI coverage at all until
  # now — only the staff app (matatu-mms, job above) was typechecked/built
  # here, so a broken change to either of the other two could merge to
  # master with nothing catching it. Same job shape as "frontend" above,
  # just pointed at the other two app directories.
  frontend-public:
    name: Frontend Public (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matatu-mms-public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matatu-mms-public/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000

      # NotificationBell.tsx is deliberately kept byte-identical between
      # matatu-mms and matatu-mms-public (see the file's own header
      # comment) rather than pulled into a shared package — the two apps'
      # type surfaces have otherwise genuinely diverged (confirmed by
      # diffing lib/types.ts: Trip/QueueStatus only exist on the public
      # side, Beat/EnforcementCase review fields/ComplianceFunnel only on
      # the staff side), so a full shared-package abstraction would be
      # solving a problem that's smaller than it looks. This one real
      # duplicate file is worth guarding directly: fail CI the moment the
      # two copies drift, instead of relying on someone remembering to
      # copy the file by hand.
      - name: Verify NotificationBell.tsx is identical to the staff app's copy
        run: diff ../matatu-mms/components/NotificationBell.tsx components/NotificationBell.tsx

      # PageBanner.tsx is the same situation as NotificationBell.tsx above —
      # confirmed byte-identical before the 2026-08-27 compact redesign, and
      # kept byte-identical by applying that edit to both copies. Same
      # reasoning: guard the one file that's a real duplicate, rather than
      # pretending the two apps' broader type/component surfaces are more
      # alike than they are.
      - name: Verify PageBanner.tsx is identical to the staff app's copy
        run: diff ../matatu-mms/components/PageBanner.tsx components/PageBanner.tsx

  frontend-ops:
    name: Frontend Ops (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matatu-mms-ops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matatu-mms-ops/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8000

  backend:
    name: Backend (boot-smoke tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run boot-smoke test suite
        # Self-contained: spins up the app in-process against a throwaway
        # SQLite DB (no Postgres/Redis needed) and exercises the core
        # flows — login, RBAC scoping, fine issuance + audit log, dispute,
        # NairobiPay callback, webhook delivery + logging.
        run: python test_backend.py
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production

  performance-budget:
    name: Frontend performance budget
    runs-on: ubuntu-latest
    # Enforced, not advisory. Bundle regressions are always gradual — every
    # individual dependency looks affordable — and a budget nothing blocks
    # on is a number in a document rather than a constraint.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matatu-mms-public/package-lock.json

      - name: Build the public app
        working-directory: matatu-mms-public
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
          SESSION_SECRET: ci-only-not-a-real-secret

      - name: Check first-load JS against the budget
        # The passenger app specifically: it is the one used on lower-end
        # Android over mobile data, where bundle size decides whether the
        # app opens at all. The staff apps run on desktops in county
        # offices and are held to a looser standard.
        run: node scripts/check-bundle-budget.mjs matatu-mms-public --budget-kb=200

  security-scan:
    name: Dependency + container vulnerability scan
    runs-on: ubuntu-latest
    # Advisory, not blocking (Readiness List §4). A newly-disclosed CVE in a
    # transitive dependency should not stop an unrelated hotfix from
    # shipping — especially for a system where the hotfix may itself be the
    # incident response. Findings surface in the job summary and are
    # triaged deliberately rather than by whoever is blocked at the time.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Scan Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt
          # Fails the step (not the workflow, see continue-on-error) so the
          # result is visible in the checks list rather than silently green.
          summary: true

      - name: Scan Node dependencies
        run: |
          for app in matatu-mms matatu-mms-public matatu-mms-ops; do
            echo "::group::npm audit — $app"
            (cd "$app" && npm audit --audit-level=high) || true
            echo "::endgroup::"
          done

      - name: Build backend image for scanning
        run: docker build -t mms-backend:scan ./backend

      - name: Scan backend image for OS/library CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mms-backend:scan
          format: table
          severity: HIGH,CRITICAL
          # Base-image CVEs with no fix available are noise on every run —
          # report only what can actually be acted on.
          ignore-unfixed: true

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  postgres-integration:
    name: Postgres/PostGIS integration + migration checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # ARCHITECTURE_DECISIONS.md §14.2 — the `backend` job above proves the
    # app boots and its logic holds, but on SQLite; production runs
    # Postgres + PostGIS, which has no SQLite equivalent for its dialect,
    # transaction, and extension behaviour. This job runs the identical
    # boot-smoke suite against the real engine instead.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matatu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/matatu_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate to head
        run: alembic upgrade head

      - name: Migration down/up check
        # §14.3 — "Alembic migration up and down", to catch an irreversible
        # or blocking migration before it ever reaches a real deploy.
        # Scoped to the latest migration rather than a full downgrade to
        # base: this repo's early migrations include one-way defensive
        # extension-enable steps (PostGIS/TimescaleDB, autocommit_block)
        # that were never designed to be repeatedly enabled/disabled in a
        # single run, and production itself never downgrades past the
        # migration it's currently on. Testing the newest migration's own
        # reversibility catches the mistake that actually matters — "the
        # migration I just wrote has a broken downgrade" — without that
        # unrelated fragility. (A known, pre-existing gap: the enable_postgis
        # migration's downgrade does fail on a full `downgrade base` walk —
        # tracked as a follow-up, not fixed here, since it has zero effect
        # on this project's actual deploy flow, which never downgrades.)
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Run boot-smoke test suite against Postgres/PostGIS
        run: python test_backend.py

  build-and-push:
    name: Build & push images (git-SHA tagged)
    runs-on: ubuntu-latest
    needs: [frontend, frontend-public, frontend-ops, backend, postgres-integration]
    # CD, not CI — only runs once all checks pass on a real push to
    # master/main, never on a PR (ARCHITECTURE_DECISIONS.md §14.4: "build
    # once, promote the same artefact" — a PR build would never be the
    # thing that actually ships). Pushes to GitHub Container Registry
    # (ghcr.io) using the repo's own built-in GITHUB_TOKEN — no extra
    # registry secret to provision. Deploying the pushed image (staging
    # auto, production manual-approval, canary promotion) is the remaining
    # step once there's an orchestrator/second environment to deploy onto;
    # see docker-compose.canary.yml + scripts/canary-promote.sh for the
    # blue/green mechanics that step would drive.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            siteUrl: ""
          - name: frontend
            context: matatu-mms
            siteUrl: "https://matatu.nairobi.go.ke"
          - name: frontend-public
            context: matatu-mms-public
            siteUrl: "https://book.matatu.nairobi.go.ke"
          - name: frontend-ops
            context: matatu-mms-ops
            siteUrl: "https://ops.matatu.nairobi.go.ke"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          # Frontend-only build args (Next.js bakes NEXT_PUBLIC_* into the
          # client bundle at build time — no-op for the backend build).
          #
          # Unlike the `frontend`/`frontend-public`/`frontend-ops` jobs above
          # (typecheck+build only, correctly fine to point at localhost —
          # they never ship), these images ARE what Argo CD deploys
          # (infra/argocd/), so they must carry real values or every
          # frontend goes live with wrong baked-in URLs (dead map, dead
          # WebSockets, robots.txt/sitemap/OG images pointing at
          # localhost — the same class of bug already found and fixed once
          # for the Render build path, and previously unfixed here since
          # this is a separate build). `vars.*` fallbacks keep this job
          # green on a fork with no repo vars configured; a real deployment
          # sets NEXT_PUBLIC_BACKEND_URL/NEXT_PUBLIC_WS_URL as repository
          # variables pointing at the actual cluster ingress
          # (infra/kubernetes/ingress.yaml) once one exists.
          # NEXT_PUBLIC_SITE_URL is per-app (matrix.siteUrl above), since
          # each frontend has its own public origin — empty for the backend
          # build, where it's simply unused.
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || 'https://api.matatu.nairobi.go.ke' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'wss://api.matatu.nairobi.go.ke' }}
            NEXT_PUBLIC_TOMTOM_API_KEY=${{ secrets.NEXT_PUBLIC_TOMTOM_API_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ matrix.siteUrl }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan image for vulnerabilities
        # §14.3 — container image scan. Reports, doesn't block the build
        # (exit-code 0): base-image CVEs are common and often not
        # immediately actionable; wiring this to actually fail the build on
        # HIGH/CRITICAL findings is a reasonable tightening once there's a
        # process for triaging them, not a default to ship with unreviewed.
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

  update-gitops-manifests:
    name: Update Argo CD image tags
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push'
    # This job is the actual GitOps deploy trigger for the Argo CD path
    # (infra/argocd/), separate from Render's own auto-deploy (which just
    # watches deploy/render-demo directly and needs nothing from CI). Argo
    # CD's Application (infra/argocd/application.yaml) has automated sync
    # enabled and polls this repo's `master` branch — this job's commit is
    # what it detects and acts on. There is deliberately no `kubectl apply`
    # or `argocd app sync` call anywhere here: pushing a git commit and
    # letting Argo CD notice it IS the deployment step, by design (that's
    # what makes this GitOps rather than a push-based pipeline).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow, detached checkout can't be committed back to and
          # pushed cleanly against a branch that may have moved since
          # build-and-push started — fetch-depth 0 with ref explicitly set
          # keeps this a real, pushable branch checkout.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3 /usr/local/bin

      - name: Pin image tags to this commit's SHA
        working-directory: infra/kubernetes
        run: |
          kustomize edit set image \
            ghcr.io/${{ github.repository }}/backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/frontend-public=ghcr.io/${{ github.repository }}/frontend-public:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/frontend-ops=ghcr.io/${{ github.repository }}/frontend-ops:${{ github.sha }}

      - name: Commit and push, if the tags actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- infra/kubernetes/kustomization.yaml; then
            echo "No image-tag change (rebuild of an already-deployed SHA) — nothing to commit."
            exit 0
          fi
          git add infra/kubernetes/kustomization.yaml
          # [skip ci]: this commit only touches image tags and must not
          # re-trigger this same workflow — without it, every deploy would
          # queue a second, pointless CI run against its own GitOps commit.
          git commit -m "chore(gitops): deploy ${{ github.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
