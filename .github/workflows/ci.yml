name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matatu-mms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matatu-mms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build doesn't fail on missing secrets — this
          # job only proves the app compiles, it doesn't hit a real backend.
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000

  # matatu-mms-public and matatu-mms-ops had no CI coverage at all until
  # now — only the staff app (matatu-mms, job above) was typechecked/built
  # here, so a broken change to either of the other two could merge to
  # master with nothing catching it. Same job shape as "frontend" above,
  # just pointed at the other two app directories.
  frontend-public:
    name: Frontend Public (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matatu-mms-public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matatu-mms-public/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000

      # NotificationBell.tsx is deliberately kept byte-identical between
      # matatu-mms and matatu-mms-public (see the file's own header
      # comment) rather than pulled into a shared package — the two apps'
      # type surfaces have otherwise genuinely diverged (confirmed by
      # diffing lib/types.ts: Trip/QueueStatus only exist on the public
      # side, Beat/EnforcementCase review fields/ComplianceFunnel only on
      # the staff side), so a full shared-package abstraction would be
      # solving a problem that's smaller than it looks. This one real
      # duplicate file is worth guarding directly: fail CI the moment the
      # two copies drift, instead of relying on someone remembering to
      # copy the file by hand.
      - name: Verify NotificationBell.tsx is identical to the staff app's copy
        run: diff ../matatu-mms/components/NotificationBell.tsx components/NotificationBell.tsx

  frontend-ops:
    name: Frontend Ops (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matatu-mms-ops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: matatu-mms-ops/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8000

  backend:
    name: Backend (boot-smoke tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run boot-smoke test suite
        # Self-contained: spins up the app in-process against a throwaway
        # SQLite DB (no Postgres/Redis needed) and exercises the core
        # flows — login, RBAC scoping, fine issuance + audit log, dispute,
        # NairobiPay callback, webhook delivery + logging.
        run: python test_backend.py
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production

  postgres-integration:
    name: Postgres/PostGIS integration + migration checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # ARCHITECTURE_DECISIONS.md §14.2 — the `backend` job above proves the
    # app boots and its logic holds, but on SQLite; production runs
    # Postgres + PostGIS, which has no SQLite equivalent for its dialect,
    # transaction, and extension behaviour. This job runs the identical
    # boot-smoke suite against the real engine instead.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matatu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/matatu_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate to head
        run: alembic upgrade head

      - name: Migration down/up check
        # §14.3 — "Alembic migration up and down", to catch an irreversible
        # or blocking migration before it ever reaches a real deploy.
        # Scoped to the latest migration rather than a full downgrade to
        # base: this repo's early migrations include one-way defensive
        # extension-enable steps (PostGIS/TimescaleDB, autocommit_block)
        # that were never designed to be repeatedly enabled/disabled in a
        # single run, and production itself never downgrades past the
        # migration it's currently on. Testing the newest migration's own
        # reversibility catches the mistake that actually matters — "the
        # migration I just wrote has a broken downgrade" — without that
        # unrelated fragility. (A known, pre-existing gap: the enable_postgis
        # migration's downgrade does fail on a full `downgrade base` walk —
        # tracked as a follow-up, not fixed here, since it has zero effect
        # on this project's actual deploy flow, which never downgrades.)
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Run boot-smoke test suite against Postgres/PostGIS
        run: python test_backend.py

  build-and-push:
    name: Build & push images (git-SHA tagged)
    runs-on: ubuntu-latest
    needs: [frontend, frontend-public, frontend-ops, backend, postgres-integration]
    # CD, not CI — only runs once all checks pass on a real push to
    # master/main, never on a PR (ARCHITECTURE_DECISIONS.md §14.4: "build
    # once, promote the same artefact" — a PR build would never be the
    # thing that actually ships). Pushes to GitHub Container Registry
    # (ghcr.io) using the repo's own built-in GITHUB_TOKEN — no extra
    # registry secret to provision. Deploying the pushed image (staging
    # auto, production manual-approval, canary promotion) is the remaining
    # step once there's an orchestrator/second environment to deploy onto;
    # see docker-compose.canary.yml + scripts/canary-promote.sh for the
    # blue/green mechanics that step would drive.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: matatu-mms
          - name: frontend-public
            context: matatu-mms-public
          - name: frontend-ops
            context: matatu-mms-ops
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          # Frontend-only build args (Next.js bakes NEXT_PUBLIC_* into the
          # client bundle at build time — no-op for the backend build).
          # Placeholder fallback matches the existing `frontend` job above:
          # this proves the image builds correctly; the actual deploy step
          # for a given environment would build with that environment's
          # real values rather than reusing this generic image verbatim.
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || 'http://127.0.0.1:8000' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'ws://127.0.0.1:8000' }}
            NEXT_PUBLIC_TOMTOM_API_KEY=${{ secrets.NEXT_PUBLIC_TOMTOM_API_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan image for vulnerabilities
        # §14.3 — container image scan. Reports, doesn't block the build
        # (exit-code 0): base-image CVEs are common and often not
        # immediately actionable; wiring this to actually fail the build on
        # HIGH/CRITICAL findings is a reasonable tightening once there's a
        # process for triaging them, not a default to ship with unreviewed.
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
