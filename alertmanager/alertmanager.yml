# Starter Alertmanager config — routes everything to a webhook by default.
# Replace the receiver below with your real channel: Slack incoming webhook,
# PagerDuty, email, or an SMS gateway (given the "someone must actually get
# paged" requirement for a 24/7 system serving millions of users).
route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://host.docker.internal:5001/alerts"
        send_resolved: true

