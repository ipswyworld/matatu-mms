# Real receiver — Slack, per ADMIN_DASHBOARD_AUDIT_AND_RECOMMENDATIONS.md
# §6.5: "a monitoring console nobody gets paged from is just a dashboard
# people forget to check." Slack is the lowest-friction real channel for
# this team's current size (no PagerDuty/Twilio account needed, a webhook
# is a 2-minute setup) — swap for pagerduty_configs/sms if on-call rotation
# ever needs something that escalates past a channel message.
#
# Setup: create a Slack incoming webhook (api.slack.com/apps → your app →
# Incoming Webhooks) and set SLACK_WEBHOOK_URL below, or better, keep it out
# of version control entirely by templating this file at deploy time — see
# the note at the bottom of this file.
#
# Severity split: `critical` (BackendDown) pages #matatu-mms-incidents with
# a short repeat interval — someone needs to see this fast. `warning`
# (HighErrorRate, HighRequestLatency) goes to a quieter #matatu-mms-alerts
# channel with a longer repeat, since those are "worth investigating soon,"
# not "the system is down right now."
route:
  receiver: "slack-warning"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "slack-critical"
      group_wait: 10s
      repeat_interval: 30m
      continue: false

receivers:
  - name: "slack-critical"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#matatu-mms-incidents"
        send_resolved: true
        title: "🔴 {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"

  - name: "slack-warning"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#matatu-mms-alerts"
        send_resolved: true
        title: "🟡 {{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"

# Alertmanager's config file does NOT support ${VAR} substitution natively
# (unlike docker-compose.yml) — the ${SLACK_WEBHOOK_URL} above is a
# placeholder for envsubst, not something Alertmanager itself will resolve.
# docker-compose.yml's alertmanager service now runs envsubst against this
# file at container start (see the `command:` override there) so the real
# URL comes from the SLACK_WEBHOOK_URL environment variable / .env file and
# never has to be committed here in plaintext.
