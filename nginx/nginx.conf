worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # Structured (JSON-ish) access log — easy to ship to a log aggregator
    # alongside the backend's JSON application logs.
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"host":"$host"'
        '}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Uploaded scene photos / verification documents can be several MB each.
    client_max_body_size 20m;

    # --- Rate limiting zones ---
    # Auth endpoints are the highest-value brute-force target; the public
    # payment/onboarding endpoints need protection from abuse without
    # blocking genuine burst traffic (e.g. many officers filing cases at
    # shift start).
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=public_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=60r/s;
    limit_req_status 429;

    # --- Upstreams ---
    upstream frontend_upstream {
        # Add more `server` lines here (frontend_2:3000, etc.) once the
        # Next.js app runs as more than one instance behind this proxy.
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    # --- Ops/monitoring upstreams — only ever reached through the :3002
    # server block below, never through the public 80/443 block above. ---
    upstream grafana_upstream {
        server grafana:3000;
    }

    upstream prometheus_upstream {
        server prometheus:9090;
    }

    upstream alertmanager_upstream {
        server alertmanager:9093;
    }

    upstream ops_upstream {
        server matatu-mms-ops:3002;
    }

    # --- Internal-only: nginx's own stub_status for nginx-prometheus-exporter.
    # Listens on 8080, which is never published to the host in docker-compose.yml
    # (only 80/443 are) — reachable only from other containers on the same
    # Docker network, never from outside. ---
    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }

    # --- HTTP: redirect to HTTPS, except health checks and ACME challenge ---
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /healthz {
            proxy_pass http://backend_upstream/healthz;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Self-signed cert for local/dev use — replace with a real
        # certificate (Let's Encrypt via certbot, or your CA of choice)
        # before this ever serves real traffic. See README in this folder.
        ssl_certificate     /etc/nginx/certs/dev-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/dev-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # --- Auth endpoints: tight rate limit against credential stuffing ---
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # --- Public, unauthenticated endpoints (offender payment lookup,
        # operator onboarding) — looser limit than auth, tighter than general ---
        location ~ ^/api/(enforcement/cases/public|saccos/onboard) {
            limit_req zone=public_zone burst=30 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # --- WebSockets: GPS telemetry + live dashboard refresh ---
        location ~ ^/api/(telemetry/ws|events/ws) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            include /etc/nginx/proxy_params.conf;
        }

        # --- Uploaded documents / scene photos ---
        location /uploads/ {
            limit_req zone=general_zone burst=40 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # --- Everything else under /api → FastAPI backend ---
        location /api/ {
            limit_req zone=general_zone burst=40 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Prometheus/metrics endpoint is internal-only — never exposed
        # through the public edge. Scrape it via the Docker network directly.
        location /metrics {
            deny all;
            return 403;
        }

        # --- Next.js frontend (everything not matched above) ---
        location / {
            limit_req zone=general_zone burst=60 nodelay;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Next.js static assets — long cache, immutable (hashed filenames)
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # --- Superuser / technical monitoring console (ADMIN_DASHBOARD_AUDIT
    # §4.3) — Option A (this network-restricted front door) now proxies to
    # Option B (matatu-mms-ops, its own Next.js app/process) instead of the
    # staff app's /system page. Not two alternatives: A is the network
    # isolation layer, B is the process isolation layer underneath it — a
    # crash/bad deploy in the staff app (frontend_upstream) can no longer
    # take this console down with it, since they're separate processes now.
    # Network restriction here is additive to, not a replacement for, the
    # ops app's own SUPERADMIN-only session check — both layers matter for
    # a surface this sensitive.
    #
    # docker-compose.yml binds this to 127.0.0.1:3002 on the host, so by
    # default it's reachable only via SSH tunnel/VPN into the host itself.
    # The `allow`/`deny` block below defaults safe (localhost + ::1 only,
    # deny all else) as a second layer inside the container in case that
    # host-level bind is ever loosened. If you later expose this beyond a
    # single host (e.g. a real VPN subnet reaching the container network
    # directly), uncomment and set the real CIDR below instead of relying
    # on the localhost-only default.
    server {
        listen 3002;
        server_name _;

        # allow 10.0.0.0/8;         # example: internal VPN range
        allow 127.0.0.1;
        allow ::1;
        deny all;

        # matatu-mms-ops — its own process, own session cookie
        # (mms_ops_session, own OPS_SESSION_SECRET), gated server-side to
        # SUPERADMIN accounts only (matatu-mms-ops/middleware.ts). This
        # nginx layer adds the network restriction on top.
        location / {
            proxy_pass http://ops_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /grafana/ {
            proxy_pass http://grafana_upstream/;
            include /etc/nginx/proxy_params.conf;
        }

        location /prometheus/ {
            proxy_pass http://prometheus_upstream/;
            include /etc/nginx/proxy_params.conf;
        }

        location /alertmanager/ {
            proxy_pass http://alertmanager_upstream/;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
