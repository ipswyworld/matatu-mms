worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"host":"$host"'
        '}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 20m;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=public_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=60r/s;
    limit_req_status 429;

    # --- Upstreams ---
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # Canary/blue-green upstream (ARCHITECTURE_DECISIONS.md §13.4). "backend"
    # (blue, the current live version) starts at 100% weight; "backend_green"
    # (the new candidate, added by docker-compose.canary.yml) starts at 0 —
    # inert until scripts/canary-promote.sh shifts traffic. WebSocket
    # connections are unaffected mid-flight by weight changes: nginx only
    # applies weighting to new connections, so an in-progress passenger
    # live-map stream isn't dropped when a shift happens (§13.3's drain
    # requirement is about the *retiring* colour once it reaches 0%, not
    # about every weight change).
    #
    # This file is regenerated by canary-promote.sh (it rewrites the two
    # `weight=` values in place) — hand edits to the weights will be
    # overwritten on the next promotion step; edit everything else here
    # freely, it's a plain template otherwise.
    upstream backend_upstream {
        server backend:8000 weight=10;         # blue — CANARY_WEIGHT_BLUE
        server backend_green:8000 weight=0;    # green — CANARY_WEIGHT_GREEN
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /healthz {
            proxy_pass http://backend_upstream/healthz;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/dev-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/dev-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ~ ^/api/(enforcement/cases/public|saccos/onboard) {
            limit_req zone=public_zone burst=30 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ~ ^/api/(telemetry/ws|events/ws) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            include /etc/nginx/proxy_params.conf;
        }

        location /uploads/ {
            limit_req zone=general_zone burst=40 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=general_zone burst=40 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /metrics {
            deny all;
            return 403;
        }

        location / {
            limit_req zone=general_zone burst=60 nodelay;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
