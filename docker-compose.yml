services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${BACKEND_SECRET_KEY}
      SESSION_COOKIE_NAME: mms_session
      TERMS_VERSION: ${TERMS_VERSION:-2026-07-25}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # DATABASE_URL defaults to local SQLite inside the container volume.
      # Swap for a Postgres DSN once that migration lands (see project notes) —
      # e.g. postgresql+asyncpg://user:pass@postgres:5432/matatu_mms
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/mms.db}
      # Real-time backbone (GPS telemetry, dashboard live-refresh, per-user
      # notifications) — every backend instance publishes/subscribes here
      # instead of only fanning out to its own in-memory websocket list.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  frontend:
    build: ./matatu-mms
    restart: unless-stopped 
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_ORIGIN:-https://localhost}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_ORIGIN:-wss://localhost}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks: [internal]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
    depends_on:
      - nginx
    networks: [internal]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090" # bind to localhost only — not for public exposure
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks: [internal]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000" # bind to localhost only — put behind nginx/VPN before exposing
    depends_on:
      - prometheus
    networks: [internal]

volumes:
  backend_data:
  backend_uploads:
  redis_data:
  nginx_logs:
  certbot_webroot:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
