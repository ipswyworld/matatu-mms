services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${BACKEND_SECRET_KEY}
      NAIROBIPAY_CALLBACK_SECRET: ${NAIROBIPAY_CALLBACK_SECRET}
      SESSION_COOKIE_NAME: mms_session
      TERMS_VERSION: ${TERMS_VERSION:-2026-07-25}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Real Postgres by default now — SQLite (single-writer, file-locked)
      # can't carry real concurrent traffic. Override only for a throwaway
      # local run with no docker-compose Postgres available.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://matatu:${POSTGRES_PASSWORD:-changeme}@postgres:5432/matatu_mms}
      # Real-time backbone (GPS telemetry, dashboard live-refresh, per-user
      # notifications) — every backend instance publishes/subscribes here
      # instead of only fanning out to its own in-memory websocket list.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matatu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: matatu_mms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matatu -d matatu_mms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  # Staff app — county government back-office (admin, enforcement,
  # director/chief officer, viewer). See render.yaml for the same split on
  # the Render deployment path; this mirrors it for the self-hosted stack.
  frontend:
    build: ./matatu-mms
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_ORIGIN:-https://localhost}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_ORIGIN:-wss://localhost}
      NEXT_PUBLIC_PUBLIC_APP_URL: ${PUBLIC_APP_ORIGIN:-https://localhost:3001}
      NEXT_PUBLIC_TOMTOM_API_KEY: ${NEXT_PUBLIC_TOMTOM_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET}
      # Where the retired /system page now redirects — the real external
      # address of the :3002 ops console front door (nginx/nginx.conf),
      # not the internal Docker service name (browsers can't resolve it).
      OPS_APP_URL: ${OPS_APP_ORIGIN:-https://localhost:3002}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal]

  # Public app — passengers, crew, and Sacco operators. Exposed on its own
  # host port (3001) directly rather than through nginx, matching the "own
  # port" split — nginx's TLS-terminated 80/443 in front of the staff app
  # stays as the primary reverse-proxied entry point for now; wire a real
  # nginx server block for this too before relying on it for anything but
  # local testing.
  frontend-public:
    build: ./matatu-mms-public
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_ORIGIN:-https://localhost}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_ORIGIN:-wss://localhost}
      NEXT_PUBLIC_TOMTOM_API_KEY: ${NEXT_PUBLIC_TOMTOM_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET_PUBLIC:-${SESSION_SECRET}}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal]

  # Ops console (ADMIN_DASHBOARD_AUDIT §4.3 Option B) — the former /system
  # page as its own Next.js app/process, so a crash or bad deploy in the
  # main staff app (frontend, above) can't take this down with it the way
  # sharing one process did before. Reached only through nginx's :3002
  # server block (Option A's network restriction), same as before — Option
  # A and B aren't actually alternatives here, A is the network front door
  # and B is what it now proxies to instead of the staff app's /system.
  matatu-mms-ops:
    build: ./matatu-mms-ops
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      OPS_SESSION_SECRET: ${OPS_SESSION_SECRET:?Set OPS_SESSION_SECRET in .env — openssl rand -hex 32}
      GRAFANA_EMBED_URL: /grafana/
      STAFF_APP_URL: ${PUBLIC_ORIGIN:-https://localhost}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Superuser / technical monitoring console — same nginx container,
      # a separate server block (see nginx/nginx.conf's ":3002" block,
      # which defaults its own `allow`/`deny` to localhost-only too).
      # 127.0.0.1-only here: reachable via SSH tunnel/VPN into the host
      # for now. This is ADMIN_DASHBOARD_AUDIT_AND_RECOMMENDATIONS.md §4.3
      # Option A (network isolation) fronting Option B (process isolation,
      # matatu-mms-ops below) — not two alternatives, one build on the other.
      - "127.0.0.1:3002:3002"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
      - matatu-mms-ops
    networks: [internal]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
    depends_on:
      - nginx
    networks: [internal]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090" # bind to localhost only — not for public exposure
    networks: [internal]

  # One-shot: resolves ${SLACK_WEBHOOK_URL} in alertmanager.yml into a real
  # config alertmanager can read, so the webhook URL lives in an env var /
  # .env file instead of being committed in plaintext. The official
  # alertmanager image has no shell/envsubst (busybox-based, minimal by
  # design) — this runs the substitution in a throwaway alpine container
  # before the real service starts, writing the result to a shared volume.
  alertmanager-config-init:
    image: alpine:3.20
    restart: "no"
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?Set SLACK_WEBHOOK_URL in .env — create a Slack incoming webhook first, see alertmanager/alertmanager.yml}
    volumes:
      - ./alertmanager/alertmanager.yml:/template/alertmanager.yml:ro
      - alertmanager_config:/out
    command: sh -c "apk add --no-cache gettext >/dev/null && envsubst < /template/alertmanager.yml > /out/alertmanager.yml"
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    depends_on:
      alertmanager-config-init:
        condition: service_completed_successfully
    volumes:
      - alertmanager_config:/etc/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [internal]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    # Was 127.0.0.1:3001:3000 — collided with frontend-public's 3001:3001
    # above (only masked because Grafana bound to 127.0.0.1 and
    # frontend-public didn't, so it never surfaced unless both were started
    # on the same host). 3003 is a genuinely free slot, alongside the new
    # :3002 ops-nginx block below which is the real "own port" front door
    # for Grafana going forward — this direct mapping stays as a
    # localhost-only fallback for debugging without going through nginx.
    ports:
      - "127.0.0.1:3003:3000" # bind to localhost only — put behind nginx/VPN before exposing
    depends_on:
      - prometheus
    networks: [internal]

volumes:
  alertmanager_config:
  backend_data:
  backend_uploads:
  postgres_data:
  redis_data:
  nginx_logs:
  certbot_webroot:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
