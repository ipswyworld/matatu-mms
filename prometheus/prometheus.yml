global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"

scrape_configs:
  # FastAPI backend — request rate/latency/status via prometheus-fastapi-instrumentator.
  # Scraped directly over the Docker network (not through nginx — /metrics is
  # explicitly blocked at the public edge in nginx.conf).
  - job_name: "matatu-mms-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"

  # nginx itself, via nginx-prometheus-exporter (translates nginx's stub_status
  # into Prometheus format) — see the exporter service in docker-compose.yml.
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "nginx"

  # Prometheus scraping itself, for its own health.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
