[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = .
; test_backend.py is a standalone script (invoked directly via
; `python test_backend.py`, not pytest) — it does its own module-level env
; setup and has a __main__ block, not pytest test_ functions. Scoping
; python_files to just this new suite keeps pytest from trying to collect
; it and colliding with its env/DB setup.
python_files = test_security_regressions.py
