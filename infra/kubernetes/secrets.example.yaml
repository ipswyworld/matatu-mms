# Shape only — never real values. Copy this file to `secrets.yaml`
# (already covered by .gitignore's global `**/.env*.local`-style backstop
# pattern — confirm `secrets.yaml` specifically is ignored before creating
# it), fill in real values, and `kubectl apply -f` it directly, OR — the
# better path — commit nothing here and instead have Argo CD's target
# cluster source these from whatever secret manager it has (External
# Secrets Operator + Infisical is the natural fit, since Infisical is
# already wired as this project's secrets provider — app/config.py — just
# never actually pointed at production; see MULTI_STAKEHOLDER_REVIEW.md
# §10). This file exists so the *shape* every Deployment expects is
# reviewable without ever holding a real secret.
apiVersion: v1
kind: Secret
metadata:
  name: mms-secrets
  namespace: matatu-mms
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://user:password@host:5432/dbname"
  REDIS_URL: "redis://host:6379/0"
  SECRET_KEY: "replace-with-a-real-random-value"
  NAIROBIPAY_CALLBACK_SECRET: "replace-with-a-real-random-value"
  # Shared by all three frontends (lib/session.ts) to sign their own
  # session cookies — distinct from the backend's SECRET_KEY above, which
  # signs the JWT. Rotating one does not require rotating the other.
  SESSION_SECRET: "replace-with-a-real-random-value"
---
# GHCR pull credential, referenced as imagePullSecrets by every Deployment
# in this directory (backend.yaml, control-plane-and-worker.yaml,
# frontends.yaml) — GHCR packages default to private, and the cluster
# needs its own credential to pull them; Argo CD applying the manifest is
# not itself authenticated to the registry.
#
# Generate the real one with:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<a GitHub user or bot account> \
#     --docker-password=<a PAT with read:packages> \
#     --namespace=matatu-mms \
#     --dry-run=client -o yaml
# — never hand-author the base64 .dockerconfigjson blob below; this
# `data` block is illustrative only and is not a valid credential.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: matatu-mms
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "PLACEHOLDER-generate-with-kubectl-create-secret-docker-registry"
