---
# Ops frontend. This is the staff-facing Next.js UI (login page, dashboard)
# — distinct from mms-control-plane's ops API in control-plane-and-worker.
# yaml, which deliberately has no Ingress at all. This app is public
# (staff sign in from wherever they are) and reaches the control-plane API
# only from inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mms-frontend-ops
  namespace: matatu-mms
  labels:
    app: mms-frontend-ops
    component: frontend-ops
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mms-frontend-ops
  template:
    metadata:
      labels:
        app: mms-frontend-ops
        component: frontend-ops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend-ops
          image: ghcr.io/ipswyworld/matatu-mms/frontend-ops:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Talks to the control-plane API's ClusterIP Service, not the
            # main API — that's the whole point of the control plane being
            # a separate process (control-plane-and-worker.yaml).
            - name: BACKEND_URL
              value: "http://mms-control-plane.matatu-mms.svc.cluster.local"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: mms-secrets, key: SESSION_SECRET }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mms-frontend-ops
  namespace: matatu-mms
spec:
  selector:
    app: mms-frontend-ops
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mms-frontend-ops
  namespace: matatu-mms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mms-frontend-ops
